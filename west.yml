manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - picolibc
          - mbedtls
          - mcuboot
          - net-tools
          - segger
          - cmsis
          - cmsis_6
          - lvgl
          - hal_renesas

    - name: tf-psa-crypto
      url: https://github.com/TrustedFirmware-M/TF-PSA-Crypto.git
      revision: 765af96a20a2b408474dcd950372ba9af4d26b62
      path: modules/crypto/tf-psa-crypto
